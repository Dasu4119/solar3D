name: E2E Persistence

on:
  pull_request:
    paths:
      - 'app/api/e2e/**'
      - 'e2e/**'
      - 'shared/**'
      - 'src/shared/**'
      - 'engine/**'
      - 'src/engine/**'
      - 'features/design/**'
      - 'src/features/design/**'
      - 'src/features/commercial/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'vitest.config.*'
      - 'playwright.config.*'
      - 'tsconfig.json'
      - '.github/workflows/e2e.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - 'feat/p1e3-dashboard-production'
      - 'main'
    paths:
      - 'app/api/e2e/**'
      - 'e2e/**'
      - 'shared/**'
      - 'src/shared/**'
      - 'engine/**'
      - 'src/engine/**'
      - 'features/design/**'
      - 'src/features/design/**'
      - 'src/features/commercial/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'vitest.config.*'
      - 'playwright.config.*'
      - 'tsconfig.json'
      - '.github/workflows/e2e.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  E2E_BASE_URL: http://127.0.0.1:3000
  E2E_STORAGE_STATE: playwright/.auth/solar3d-ci.json
  E2E_SUPABASE_URL: https://dprsjuqcmfiroilrpvkw.supabase.co
  E2E_SUPABASE_ANON_KEY: sb_publishable_hc9RL4clsz0T7cVykJKjZw_ZXYh6sYG

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked npm dependencies
        run: npm ci
      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
      - name: Run complete unit suite
        run: |
          set -o pipefail
          npm run test:unit -- --reporter=verbose 2>&1 | tee unit-tests.log
      - name: Upload unit-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics
          path: unit-tests.log
      - name: Run large-layout performance benchmark
        run: npm run test:unit -- src/engine/solar/layout/__tests__/large-layout-performance.test.ts --reporter=verbose
      - name: Build production application
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.E2E_SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          npm run build 2>&1 | tee production-build.log
      - name: Upload production-build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-diagnostics
          path: production-build.log
      - name: Bootstrap authenticated E2E fixture with GitHub OIDC
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=solar3d-e2e" | jq -r '.value')"
          HTTP_STATUS="$(curl -sS -o bootstrap-response.json -w '%{http_code}' -X POST "${E2E_SUPABASE_URL}/functions/v1/ci-e2e-bootstrap" \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"action":"bootstrap"}')"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            jq -c '{stage:(.stage // "unknown"),error:(.error // "bootstrap failed")}' bootstrap-response.json > next-e2e.log 2>/dev/null || printf '{"stage":"unknown","error":"non-json bootstrap failure","http_status":"%s"}\n' "${HTTP_STATUS}" > next-e2e.log
            rm -f bootstrap-response.json
            echo "OIDC bootstrap failed with HTTP ${HTTP_STATUS}" >&2
            exit 1
          fi

          RESPONSE="$(cat bootstrap-response.json)"
          rm -f bootstrap-response.json
          FIXTURE_ID="$(jq -r '.fixture_id' <<<"${RESPONSE}")"
          PROJECT_A="$(jq -r '.org_a.project_id' <<<"${RESPONSE}")"
          PROJECT_B="$(jq -r '.org_b.project_id' <<<"${RESPONSE}")"
          TOKEN_A="$(jq -r '.org_a.access_token' <<<"${RESPONSE}")"
          TOKEN_B="$(jq -r '.org_b.access_token' <<<"${RESPONSE}")"
          EMAIL_A="$(jq -r '.org_a.email' <<<"${RESPONSE}")"
          PASSWORD_A="$(jq -r '.org_a.password' <<<"${RESPONSE}")"
          RESOURCE_IDS="$(jq -c '.org_b_resource_ids' <<<"${RESPONSE}")"
          SESSION_SECRET="$(openssl rand -hex 32)"

          for secret in "${TOKEN_A}" "${TOKEN_B}" "${PASSWORD_A}" "${SESSION_SECRET}"; do echo "::add-mask::${secret}"; done
          {
            echo "E2E_FIXTURE_ID=${FIXTURE_ID}"
            echo "E2E_PROJECT_ID=${PROJECT_A}"
            echo "E2E_ORG_A_PROJECT_ID=${PROJECT_A}"
            echo "E2E_ORG_B_PROJECT_ID=${PROJECT_B}"
            echo "E2E_ORG_A_ACCESS_TOKEN=${TOKEN_A}"
            echo "E2E_ORG_B_ACCESS_TOKEN=${TOKEN_B}"
            echo "E2E_ORG_A_EMAIL=${EMAIL_A}"
            echo "E2E_ORG_A_PASSWORD=${PASSWORD_A}"
            echo "E2E_ORG_B_RESOURCE_IDS_JSON=${RESOURCE_IDS}"
            echo "E2E_SESSION_BOOTSTRAP_SECRET=${SESSION_SECRET}"
          } >> "${GITHUB_ENV}"
      - name: Validate authenticated E2E configuration
        run: |
          set -euo pipefail
          required=(E2E_BASE_URL E2E_PROJECT_ID E2E_STORAGE_STATE E2E_SUPABASE_URL E2E_SUPABASE_ANON_KEY E2E_ORG_A_ACCESS_TOKEN E2E_ORG_B_ACCESS_TOKEN E2E_ORG_A_PROJECT_ID E2E_ORG_B_PROJECT_ID E2E_ORG_B_RESOURCE_IDS_JSON E2E_ORG_A_EMAIL E2E_ORG_A_PASSWORD E2E_SESSION_BOOTSTRAP_SECRET)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then echo "Missing required authenticated E2E value: ${name}" >&2; exit 1; fi
          done
          node - <<'NODE'
          const ids = JSON.parse(process.env.E2E_ORG_B_RESOURCE_IDS_JSON);
          const required = ['projects','sites','designs','roofs','panel_layouts','simulation_runs','financial_runs','bom_runs','proposal_runs'];
          for (const table of required) if (!ids[table]) throw new Error(`E2E_ORG_B_RESOURCE_IDS_JSON missing ${table}`);
          console.log('GitHub-OIDC authenticated E2E fixture is complete');
          NODE
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium browser binary
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Start production application for E2E
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.E2E_SUPABASE_ANON_KEY }}
          E2E_TEST_MODE: '1'
          E2E_SESSION_BOOTSTRAP_SECRET: ${{ env.E2E_SESSION_BOOTSTRAP_SECRET }}
        run: |
          set -euo pipefail
          npm start > next-e2e.log 2>&1 &
          echo $! > next-e2e.pid
          for attempt in $(seq 1 60); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "${E2E_BASE_URL}/projects/${E2E_PROJECT_ID}/design" || true)"
            if [ "${code}" != "000" ]; then echo "Production app is reachable with HTTP ${code}"; exit 0; fi
            sleep 1
          done
          cat next-e2e.log
          exit 1
      - name: Run authenticated E2E suite
        run: npm run test:e2e -- --project=chromium
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-e2e-diagnostics
          path: |
            next-e2e.log
            test-results
            playwright-report
          if-no-files-found: ignore
      - name: Stop production application
        if: always()
        run: |
          if [ -f next-e2e.pid ]; then kill "$(cat next-e2e.pid)" 2>/dev/null || true; fi
      - name: Cleanup authenticated E2E fixture
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${E2E_FIXTURE_ID:-}" ]; then echo "No E2E fixture was registered; nothing to clean"; exit 0; fi
          OIDC_TOKEN="$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=solar3d-e2e" | jq -r '.value')"
          CLEANUP_RESPONSE="$(curl --fail-with-body -sS -X POST "${E2E_SUPABASE_URL}/functions/v1/ci-e2e-cleanup" \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "{\"fixture_id\":\"${E2E_FIXTURE_ID}\"}")"
          jq -e '.success == true and .verified_cleanup == true' <<<"${CLEANUP_RESPONSE}" >/dev/null
          echo "Authenticated E2E fixture cleanup verified"
