name: E2E Persistence

on:
  pull_request:
    paths:
      - 'e2e/**'
      - 'shared/**'
      - 'src/shared/**'
      - 'engine/**'
      - 'src/engine/**'
      - 'features/design/**'
      - 'src/features/design/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'vitest.config.*'
      - 'playwright.config.*'
      - '.github/workflows/e2e.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - 'feat/p1e3-dashboard-production'
      - 'main'
    paths:
      - 'e2e/**'
      - 'shared/**'
      - 'src/shared/**'
      - 'engine/**'
      - 'src/engine/**'
      - 'features/design/**'
      - 'src/features/design/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'vitest.config.*'
      - 'playwright.config.*'
      - '.github/workflows/e2e.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked npm dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run complete unit suite
        run: npm run test:unit
      - name: Run large-layout performance benchmark
        run: npm run test:unit -- src/engine/solar/layout/__tests__/large-layout-performance.test.ts --reporter=verbose
      - name: Build production application
        run: npm run build
      - name: Validate authenticated E2E configuration
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_PROJECT_ID: ${{ secrets.E2E_PROJECT_ID }}
          E2E_STORAGE_STATE: ${{ secrets.E2E_STORAGE_STATE }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_ORG_A_ACCESS_TOKEN: ${{ secrets.E2E_ORG_A_ACCESS_TOKEN }}
          E2E_ORG_B_ACCESS_TOKEN: ${{ secrets.E2E_ORG_B_ACCESS_TOKEN }}
          E2E_ORG_A_PROJECT_ID: ${{ secrets.E2E_ORG_A_PROJECT_ID }}
          E2E_ORG_B_PROJECT_ID: ${{ secrets.E2E_ORG_B_PROJECT_ID }}
          E2E_ORG_B_RESOURCE_IDS_JSON: ${{ secrets.E2E_ORG_B_RESOURCE_IDS_JSON }}
        run: |
          set -euo pipefail
          required=(E2E_BASE_URL E2E_PROJECT_ID E2E_STORAGE_STATE E2E_SUPABASE_URL E2E_SUPABASE_ANON_KEY E2E_ORG_A_ACCESS_TOKEN E2E_ORG_B_ACCESS_TOKEN E2E_ORG_A_PROJECT_ID E2E_ORG_B_PROJECT_ID E2E_ORG_B_RESOURCE_IDS_JSON)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then echo "Missing required authenticated E2E secret: ${name}" >&2; exit 1; fi
          done
          node - <<'NODE'
          const ids = JSON.parse(process.env.E2E_ORG_B_RESOURCE_IDS_JSON);
          const required = ['projects','sites','designs','roofs','panel_layouts','simulation_runs','financial_runs','bom_runs','proposal_runs'];
          for (const table of required) {
            if (!ids[table]) throw new Error(`E2E_ORG_B_RESOURCE_IDS_JSON missing ${table}`);
          }
          console.log('Authenticated E2E configuration present');
          NODE
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium browser binary
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Run authenticated E2E suite
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_PROJECT_ID: ${{ secrets.E2E_PROJECT_ID }}
          E2E_STORAGE_STATE: ${{ secrets.E2E_STORAGE_STATE }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_ORG_A_ACCESS_TOKEN: ${{ secrets.E2E_ORG_A_ACCESS_TOKEN }}
          E2E_ORG_B_ACCESS_TOKEN: ${{ secrets.E2E_ORG_B_ACCESS_TOKEN }}
          E2E_ORG_A_PROJECT_ID: ${{ secrets.E2E_ORG_A_PROJECT_ID }}
          E2E_ORG_B_PROJECT_ID: ${{ secrets.E2E_ORG_B_PROJECT_ID }}
          E2E_ORG_B_RESOURCE_IDS_JSON: ${{ secrets.E2E_ORG_B_RESOURCE_IDS_JSON }}
        run: npm run test:e2e -- --project=chromium
