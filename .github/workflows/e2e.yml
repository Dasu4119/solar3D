name: E2E Persistence

on:
  pull_request:
    paths:
      - 'e2e/**'
      - 'src/shared/api/**'
      - 'src/engine/**'
      - 'features/design/**'
      - 'vitest.config.*'
      - 'playwright.config.*'
      - '.github/workflows/e2e.yml'
      - 'package.json'
  push:
    branches:
      - 'feat/p1e3-dashboard-production'
      - 'main'
    paths:
      - 'e2e/**'
      - 'src/shared/api/**'
      - 'src/engine/**'
      - 'features/design/**'
      - 'vitest.config.*'
      - 'playwright.config.*'
      - '.github/workflows/e2e.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm dependencies
        run: npm install

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Chromium browser binary
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run golden acceptance regression
        run: npm run test:unit -- src/engine/solar/fixtures/golden-acceptance.test.ts

      - name: Run persistence unit tests
        run: npm run test:unit -- src/shared/api/__tests__/design-persistence-roof.test.ts

      - name: Run production heatmap unit tests
        run: npm run test:unit -- features/design/production-heatmap.test.ts

      - name: Run annual production engine unit tests
        run: npm run test:unit -- src/engine/solar/production/annual-production.test.ts

      - name: Run dashboard production adapter tests
        run: npm run test:unit -- src/app/dashboard/production-metrics.test.ts

      - name: Run persistence E2E
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_PROJECT_ID: ${{ secrets.E2E_PROJECT_ID }}
          E2E_STORAGE_STATE: ${{ secrets.E2E_STORAGE_STATE }}
        run: npm run test:e2e -- --project=chromium
