name: Roof Plane Regression

on:
  pull_request:
    paths:
      - 'src/engine/roof/**'
      - 'package.json'
      - '.github/workflows/roof-plane.yml'
  workflow_dispatch:

jobs:
  roof-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:unit -- src/engine/roof/plane-extraction.test.ts
