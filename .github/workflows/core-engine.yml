name: Solar3D Core Engine

on:
  pull_request:
    paths:
      - "backend/solar3d_core/**"
      - ".github/workflows/core-engine.yml"
  push:
    branches: [main]
    paths:
      - "backend/solar3d_core/**"
      - ".github/workflows/core-engine.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/solar3d_core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/solar3d_core/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run unit tests
        run: pytest -q
      - name: Import API application
        run: python -c "from solar3d_core.main import app; print(app.title)"
