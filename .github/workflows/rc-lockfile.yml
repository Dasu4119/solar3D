name: RC Lockfile

on:
  push:
    branches:
      - pm/rc-security-e2e-gate
    paths:
      - package.json
      - .github/workflows/rc-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pm/rc-security-e2e-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add reproducible npm lockfile"
          git push origin HEAD:pm/rc-security-e2e-gate
